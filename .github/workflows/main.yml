#!/bin/bash
set -euxo pipefail

# Configurações
PROJECT_ID="SEU_PROJECT_ID"
ZONE="us-central1-a"
INSTANCE_NAME="vm-gpu-dev"

# 1) Criar a VM com GPU
gcloud compute instances create "$INSTANCE_NAME" \
  --project="$PROJECT_ID" \
  --zone="$ZONE" \
  --machine-type=n1-standard-8 \
  --accelerator=count=1,type=nvidia-tesla-t4 \
  --maintenance-policy=TERMINATE \
  --boot-disk-size=100GB \
  --boot-disk-type=pd-ssd \
  --image-family=ubuntu-2204-lts \
  --image-project=ubuntu-os-cloud \
  --metadata=install-nvidia-driver=True \
  --tags=vm-gpu

# 2) Liberar firewall (SSH, Jupyter e TensorBoard)
gcloud compute firewall-rules create allow-vm-gpu \
  --project="$PROJECT_ID" \
  --allow=tcp:22,tcp:8888,tcp:6006 \
  --source-ranges=0.0.0.0/0 \
  --target-tags=vm-gpu || true

# 3) Conectar e preparar ambiente
gcloud compute ssh "$INSTANCE_NAME" \
  --project="$PROJECT_ID" \
  --zone="$ZONE" \
  --command='
    set -euxo pipefail
    sudo apt update
    sudo apt install -y python3-pip python3-venv git curl

    python3 -m venv ~/venv
    . ~/venv/bin/activate

    pip install --upgrade pip
    pip install jupyter torch --index-url https://download.pytorch.org/whl/cu121
  '

echo
echo "VM criada com sucesso!"
echo "Acesse via SSH:"
echo "gcloud compute ssh $INSTANCE_NAME --project=$PROJECT_ID --zone=$ZONE"
echo
echo "Para iniciar o Jupyter:"
echo "gcloud compute ssh $INSTANCE_NAME --project=$PROJECT_ID --zone=$ZONE -- -L 8888:localhost:8888"
echo "then: jupyter notebook --ip 0.0.0.0 --port 8888"
